*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.55 'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus,#e8b92e);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.h1{font:700 clamp(34px,5.4vw,60px)/1.04 var(--display);margin:0 0 .35em;letter-spacing:var(--h-ls,0)}
.h2{font:700 clamp(28px,3.6vw,42px)/1.1 var(--display);margin:0 0 .4em;letter-spacing:var(--h-ls,0)}
.h3{font:700 22px/1.2 var(--display);margin:0 0 .5em;letter-spacing:var(--h-ls,0)}
.lead{font-size:clamp(18px,2vw,21px);color:var(--muted);max-width:60ch}
.fine{font-size:14px;color:var(--muted);margin:.8em 0 0}
.demo-only{border-left:3px solid var(--focus,#e8b92e);padding-left:10px}
/* fascia anteprima */
.band{position:sticky;top:0;z-index:300;background:#111;color:#fff;text-align:center;font:600 13px/1 'Barlow Condensed','Barlow',sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px}
.band b{color:#ffd54a}
/* bottoni */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:var(--r-btn,999px);border:2px solid transparent;font:700 16px/1 'Barlow',sans-serif;letter-spacing:.02em;text-decoration:none;cursor:pointer;transition:transform .15s,background .15s,color .15s,border-color .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-d)}
.btn-ghost{background:transparent;border-color:var(--line-strong,currentColor);color:var(--fg)}
.btn-ghost:hover{background:var(--fg);color:var(--bg)}
.btn-wa{background:#1f9d55}.btn-wa:hover{background:#17803f}
.btn-sm{min-height:40px;padding:0 16px;font-size:15px}
/* stepper */
.stepper{display:inline-flex;align-items:center;border:2px solid var(--line-strong,var(--line));border-radius:999px;background:var(--card)}
.stepper button{width:44px;height:44px;border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;border-radius:999px}
.stepper button:hover{background:var(--line)}
.stepper output{min-width:84px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
/* lista */
.list-page{padding:40px 20px 80px}
.list-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:start;margin-top:24px}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.row{display:grid;grid-template-columns:64px 1fr auto 36px;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r,16px);padding:12px 14px}
.row-img{width:64px;height:64px;border-radius:12px;background:var(--thumb,#f1e9dc);display:grid;place-items:center;overflow:hidden}
.row-img svg{width:54px;height:54px}
.row-name{font-weight:700;font-size:18px}
.row-note input{width:100%;border:0;border-bottom:1px dashed var(--line-strong,var(--line));background:transparent;padding:4px 0;font-size:15px;color:var(--muted)}
.row-note input:focus{outline:none;border-color:var(--accent);color:var(--fg)}
.row-x{border:0;background:transparent;font-size:26px;cursor:pointer;color:var(--muted);width:36px;height:36px;border-radius:50%}
.row-x:hover{background:var(--line);color:var(--fg)}
.orderform{background:var(--card);border:1px solid var(--line);border-radius:var(--r,16px);padding:24px;position:sticky;top:96px}
.orderform label{display:block;font-weight:600;font-size:15px;margin:0 0 14px}
.orderform input,.orderform textarea{display:block;width:100%;margin-top:6px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-weight:400}
.orderform input:focus,.orderform textarea:focus{outline:none;border-color:var(--accent)}
.orderform input.bad{border-color:#d33;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.preview{background:var(--bg);border:1px dashed var(--line-strong,var(--line));border-radius:12px;padding:12px 14px;margin:6px 0 16px}
.preview-h{font:700 12px/1 'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.preview pre{margin:0;white-space:pre-wrap;font:400 14px/1.5 'Barlow',sans-serif;max-height:200px;overflow:auto}
.send{display:grid;gap:10px}
.list-empty{padding:80px 20px;text-align:center}.list-empty .lead{margin:0 auto 24px}
/* scheda prodotto */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
.pd-img{background:var(--thumb,#f1e9dc);border-radius:var(--r,20px);display:grid;place-items:center;padding:24px;min-height:320px}
.pd-img svg{width:100%;max-width:340px;max-height:380px;height:auto;filter:drop-shadow(0 14px 14px rgba(0,0,0,.25))}
.pd-cat{font:700 13px/1 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.pd-name{font:700 clamp(32px,4vw,48px)/1.05 var(--display);margin:0 0 12px;letter-spacing:var(--h-ls,0)}
.pd-desc{font-size:19px;margin:0 0 18px}
.pd-tip{background:var(--tip,rgba(111,189,120,.16));border-radius:14px;padding:14px 16px;margin-bottom:20px;display:grid;gap:4px}
.pd-tip b{font:700 13px/1 'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase}
.pd-qty{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.lbl{font-weight:600;font-size:15px}
.pd-note{display:block;margin-bottom:18px}
.pd-note input{display:block;width:100%;margin-top:6px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.pd-note input:focus{outline:none;border-color:var(--accent)}
.pd-actions{display:flex;gap:10px;flex-wrap:wrap}
/* tessere */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r,18px);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.12)}
.card-img{display:grid;place-items:center;background:var(--thumb,#f1e9dc);height:210px;padding:16px;text-decoration:none}
.card-img svg{height:100%;width:auto;max-width:100%;filter:drop-shadow(0 8px 8px rgba(0,0,0,.22))}
.card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-cat{font:700 12px/1 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.card-name{font:700 24px/1.1 var(--display);margin:0;letter-spacing:var(--h-ls,0)}
.card-name a{text-decoration:none}
.card-desc{margin:0 0 10px;color:var(--muted);font-size:16px;flex:1}
.card-actions{display:flex;gap:8px}
/* toast */
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:#111;color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:900;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* logo */
.logo{display:block;height:auto;overflow:visible}
.logo-sign{font-family:'Mrs Saint Delafield',cursive;fill:var(--sign,#B3202A);stroke:var(--sign,#B3202A);stroke-width:1.6;paint-order:stroke}
.cut-plain .hook{display:none}
.logo-small{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.22em;fill:currentColor}
@media (max-width:860px){
 .list-grid{grid-template-columns:1fr}.orderform{position:static}
 .pd{grid-template-columns:1fr}.pd-img{min-height:240px}
 .row{grid-template-columns:52px 1fr 36px;grid-template-areas:'i m x' 's s s'}
 .row .row-img{grid-area:i;width:52px;height:52px}.row .row-main{grid-area:m}.row .row-x{grid-area:x}.row .stepper{grid-area:s;justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* icone dei tagli */
.ic{display:block;overflow:visible}
.ic .m{fill:var(--ic-m)}.ic .m2{fill:var(--ic-m2)}.ic.pork .m{fill:var(--ic-pm)}.ic.pork .m2{fill:var(--ic-pm2)}
.ic .f{fill:var(--ic-f)}.ic .b{fill:var(--ic-b)}.ic .v{fill:var(--ic-v)}.ic .g{fill:var(--ic-g)}.ic .c{fill:var(--ic-c)}
.ic .m,.ic .m2,.ic .f,.ic .b,.ic .v,.ic .g,.ic .c{stroke:var(--ic-s);stroke-width:var(--ic-w);stroke-linejoin:round}
.ic .l{fill:none;stroke:var(--ic-l);stroke-width:calc(var(--ic-w)*.62);stroke-linecap:round}
.ic .l2{fill:none;stroke:var(--ic-s);stroke-width:calc(var(--ic-w)*.55);stroke-linecap:round}
.ic .t{fill:none;stroke:var(--ic-t);stroke-width:calc(var(--ic-w)*.85);stroke-linecap:round}
.ic .s{fill:none;stroke:var(--ic-s);stroke-width:var(--ic-w);stroke-linecap:round}
.ic .k circle{fill:var(--ic-k)}
.card-img svg.ic{height:74%;width:auto;filter:none}
.pd-img svg.ic{width:70%;max-width:300px;filter:none}
.row-img svg.ic{width:46px;height:46px}

.kicker{font:700 14px/1 'Barlow Condensed',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:34px;height:2px;background:currentColor}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;gap:16px;align-items:flex-start}
.step b.n{flex:none;width:44px;height:44px;border-radius:50%;background:var(--green);color:#10361a;display:grid;place-items:center;font:700 22px/1 var(--display)}
.step h3{margin:0 0 4px;font:700 22px/1.15 var(--display)}.step p{margin:0;color:var(--muted);font-size:16px}
.sec{padding:64px 20px 8px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.sec-h .h2{margin:0}
.link-arrow{font-weight:700;text-decoration:none;border-bottom:2px solid var(--accent)}
.about{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:center;padding:72px 20px}
.about .ph{aspect-ratio:4/3;border-radius:24px;background:#ddd center/cover;box-shadow:0 20px 40px -22px rgba(0,0,0,.5)}
.about blockquote{margin:0 0 20px;font:italic 500 clamp(24px,3vw,32px)/1.25 var(--display);border-left:4px solid var(--accent);padding-left:18px}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.pills span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600}
.sign-big{width:min(440px,100%);color:var(--fg);margin-top:8px}
.page-h{padding:44px 20px 12px}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:8px 20px 20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:2px solid var(--fg);background:transparent;border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.search{padding:11px 18px;border:2px solid var(--line);border-radius:999px;background:var(--card);min-width:240px}
.search:focus{outline:none;border-color:var(--accent)}
.example{margin:0 20px 24px;background:#fff7d6;border:1px solid #ecd98a;border-radius:12px;padding:10px 14px;font-size:15px}
.empty{padding:40px 20px;color:var(--muted)}
.pd-wrap{padding:36px 20px 64px}
.back{display:inline-block;margin-bottom:18px;font-weight:600;text-decoration:none;border-bottom:2px solid var(--line-strong)}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;padding:8px 20px 64px}
.info{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.info h3{margin:0 0 8px;font:700 24px/1.1 var(--display)}
.info p{margin:.2em 0}.info a{font-weight:700}
.chip-tbc{display:inline-block;background:#fff1b8;border:1px dashed #b89a2b;border-radius:8px;padding:2px 8px;font-size:14px}
.ftr{margin-top:72px;background:var(--fg);color:#e9dfd4;padding:44px 20px 40px}
.ftr-in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:32px}
.ftr .logo{width:240px;color:#fff;--sign:#ff6b6f}
.ftr h4{margin:0 0 10px;font:700 13px/1 'Barlow Condensed',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#fff}
.ftr a{display:block;margin:.3em 0;text-decoration:none}.ftr a:hover{text-decoration:underline}
.ftr small{color:#a89c92}
@media (max-width:860px){
 .steps{grid-template-columns:1fr}.about{grid-template-columns:1fr;gap:24px;padding:48px 20px}
 .ftr-in{grid-template-columns:1fr}.sec{padding-top:44px}
}

:root{--bg:#0d151b;--card:#15232b;--fg:#e9f1f5;--muted:#9fb3be;--accent:#c9262f;--accent-d:#a51c24;--line:#25384380;--line:#263a45;--line-strong:#6f8795;--thumb:radial-gradient(circle at 50% 35%,#27424f,#162833);--display:'Bebas Neue','Barlow Condensed',Impact,sans-serif;--sign:#ff5b63;--r:16px;--h-ls:.03em;--focus:#7fd4ff;--tip:rgba(127,212,255,.1);--ic-s:#1a0d0d;--ic-w:1.5;--ic-m:#c7323b;--ic-m2:#de5058;--ic-pm:#e3888d;--ic-pm2:#efa6a9;--ic-f:#f6e4cd;--ic-b:#efe5d2;--ic-l:#f6d9c4;--ic-t:#d8b06a;--ic-v:#f2c230;--ic-g:#8fc04a;--ic-c:#da9c3c;--ic-k:#8a5512}
body{padding-bottom:0}
.band{background:#05090c}
.hdr{position:sticky;top:31px;z-index:200;background:rgba(9,15,19,.94);backdrop-filter:blur(8px);border-bottom:1px solid #1d2d37;color:var(--fg)}
.hdr-in{max-width:1380px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:24px}
.hdr .brand{color:var(--fg);display:block;width:240px;flex:none;text-decoration:none}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav a{padding:9px 14px;border-radius:999px;text-decoration:none;font:600 16px/1 'Barlow Condensed','Barlow',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.nav a:hover,.nav a[aria-current="page"]{background:#e9f1f5;color:#0d151b}
.nav .cart{background:var(--accent);color:#fff;display:inline-flex;gap:8px;align-items:center}
.nav .cart:hover{background:var(--accent-d);color:#fff}
.nav .cart i{font-style:normal;background:#fff;color:var(--accent);min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;font-size:13px;padding:0 6px}
.h1,.h2,.h3,.pd-name,.card-name{text-transform:uppercase}
.h1{font-weight:400}.h2,.h3,.pd-name,.card-name{font-weight:400}
.card{box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card-img svg,.pd-img svg{filter:drop-shadow(0 10px 12px rgba(0,0,0,.55))}

.example{background:#2a2a14;border-color:#645f20;color:#f3e9b0}

.row-img,.pd-img{background:var(--thumb)}
.stepper button:hover{background:#25414e}

/* ===== LA CELLA: corridoio in prospettiva ===== */
.cold{position:relative;height:calc(100dvh - 98px);min-height:520px;overflow:hidden;background:#0a1218;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.cold.dragging{cursor:grabbing}
.view{position:absolute;inset:0;perspective:var(--P,900px);perspective-origin:50% 44%;overflow:hidden}
.cold.dark .view{filter:brightness(.12) saturate(.4)}
.cold.lit .view{animation:lightsOn 1.7s linear both}
@keyframes lightsOn{0%{filter:brightness(.12)}7%{filter:brightness(.85)}12%{filter:brightness(.16)}20%{filter:brightness(1)}27%{filter:brightness(.3)}38%{filter:brightness(1)}100%{filter:brightness(1)}}
.world{position:absolute;left:50%;top:44%;width:0;height:0;transform-style:preserve-3d}
.world>*{position:absolute;left:0;top:0;transform-origin:0 0;backface-visibility:visible}
/* pareti: pannelli coibentati, battiscopa inox, paracolpi, brina in alto */
.wall{background:
 linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0) 14%),
 linear-gradient(180deg,transparent 0 56%,#9fb0bb 56% 57.2%,#e9f0f3 57.2% 59.4%,#8698a3 59.4% 60.4%,transparent 60.4%),
 linear-gradient(180deg,transparent 0 86%,#b9c6cd 86%,#eef3f5 89%,#8e9ea8 100%),
 repeating-linear-gradient(90deg,#dfe8ed 0 122px,#a9b8c1 122px 124px,#f4f8fa 124px 125px),
 #dfe8ed}
.wall.r{background:
 linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0) 14%),
 linear-gradient(180deg,transparent 0 56%,#9fb0bb 56% 57.2%,#e9f0f3 57.2% 59.4%,#8698a3 59.4% 60.4%,transparent 60.4%),
 linear-gradient(180deg,transparent 0 86%,#b9c6cd 86%,#eef3f5 89%,#8e9ea8 100%),
 repeating-linear-gradient(90deg,#d3dee4 0 122px,#9aabb5 122px 124px,#eaf1f4 124px 125px),#d3dee4}
.floor{background:
 linear-gradient(90deg,transparent 0 48.6%,#2b3439 48.6% 49.2%,#5d6a71 49.2% 50.8%,#2b3439 50.8% 51.4%,transparent 51.4%),
 linear-gradient(90deg,rgba(0,0,0,.35),transparent 18%,transparent 82%,rgba(0,0,0,.35)),
 repeating-linear-gradient(0deg,rgba(255,255,255,.10) 0 60px,transparent 60px 250px),
 #7d8e8c}
.ceil{background:
 linear-gradient(90deg,transparent 0 46%,#fff 47% 53%,transparent 54%),
 linear-gradient(90deg,#8796a0,#b5c2ca 30%,#b5c2ca 70%,#8796a0)}
.ceil.lamp{box-shadow:0 0 120px 30px rgba(220,240,255,.35)}
.rail{height:16px;background:linear-gradient(#f4f8fa,#90a0aa 50%,#56636c);box-shadow:0 10px 20px rgba(0,20,40,.35)}
.rod{width:8px;background:linear-gradient(90deg,#6c7a83,#dfe6ea,#6c7a83)}
.endwall{background:
 linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0) 14%),
 linear-gradient(180deg,transparent 0 86%,#b9c6cd 86%,#eef3f5 89%,#8e9ea8 100%),
 repeating-linear-gradient(90deg,#e3ebef 0 122px,#a9b8c1 122px 124px,#f4f8fa 124px 125px)}
/* tenda a strisce in PVC */
.strips{display:flex;pointer-events:none}
.strips i{flex:1;margin:0 -6px;height:100%;background:linear-gradient(90deg,rgba(255,255,255,.28),rgba(190,225,245,.16) 30%,rgba(190,225,245,.10) 70%,rgba(255,255,255,.32));border-left:1px solid rgba(255,255,255,.5);transform-origin:50% 0;animation:strip 4s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.37s)}
@keyframes strip{from{transform:skewX(-1.2deg)}to{transform:skewX(1.4deg)}}
/* postazioni: gancio + taglio + carrello */
.st{width:280px;height:600px;pointer-events:none}
.st .hk{position:absolute;left:50%;top:-14px;width:120px;margin-left:-60px}
.st .cut,.st .trayb{position:absolute;pointer-events:auto;border:0;background:none;padding:0;cursor:pointer;color:inherit}
.st .cut{left:50%;top:58px;width:196px;margin-left:-98px;text-align:center}
.st .cut .sw{display:block;transform-origin:50% -40px;animation:sway 6s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.st .cut svg{width:196px;height:196px;filter:drop-shadow(16px 20px 10px rgba(0,25,45,.35));transition:transform .25s}
.st .cut:hover svg,.st .cut:focus-visible svg,.st .trayb:hover svg,.st .trayb:focus-visible svg{transform:scale(1.07)}
.st .cut:hover .sw,.st .cut:focus-visible .sw{animation-play-state:paused}
.tag{display:inline-block;position:relative;margin-top:-2px;background:#f9f4ea;color:#151515;font:400 30px/1 'Bebas Neue',sans-serif;letter-spacing:.06em;padding:8px 16px 6px;border-radius:4px;box-shadow:0 8px 14px rgba(0,25,45,.35);transform:rotate(var(--r,-2deg));white-space:nowrap}
.tag::before{content:'';position:absolute;left:50%;top:-12px;width:2px;height:13px;background:#b49a5e}
.tag::after{content:'';position:absolute;left:10px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#0a1218;opacity:.18}
.tag small{display:block;font:700 13px/1.1 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#b3202a;margin-top:3px}
.st .cut:hover .tag,.st .cut:focus-visible .tag{background:#fff}
.trolley{position:absolute;left:30px;right:30px;top:420px;height:180px}
.trolley .p1,.cart .p2{position:absolute;left:0;right:0;height:14px;border-radius:3px;background:linear-gradient(#ffffff,#b3c0c8 60%,#7c8b95)}
.trolley .p1{top:0}.cart .p2{top:110px}

.trolley .leg.a{left:6px}.cart .leg.b{right:6px}
.trolley .wh{position:absolute;bottom:0;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#9aa7af 0 25%,#222 30%)}
.trolley .wh.a{left:0}.cart .wh.b{right:0}
.st .trayb{left:50%;top:248px;width:196px;margin-left:-98px;height:180px}
.st .trayb .vs{position:absolute;left:10px;right:10px;bottom:6px;height:46px;background:linear-gradient(#7fd08a,#4f9c5c);clip-path:polygon(0 0,100% 0,92% 100%,8% 100%);border-radius:4px}
.st .trayb svg{position:absolute;left:24px;bottom:2px;width:148px;height:148px;filter:drop-shadow(0 8px 6px rgba(0,25,45,.3))}
.slate{position:absolute;left:50%;top:430px;transform:translateX(-50%) rotate(var(--r,1.5deg));background:#1d2226;border:4px solid #8a6a43;border-radius:4px;color:#f4f1e8;font:700 25px/1 'Caveat',cursive;padding:6px 14px 4px;white-space:nowrap;box-shadow:0 6px 10px rgba(0,0,0,.35);pointer-events:auto;cursor:pointer}
.slate small{display:block;font:600 11px/1 'Barlow Condensed',sans-serif;letter-spacing:.14em;color:#9fb3be;text-transform:uppercase;margin-top:2px}
/* insegna smaltata, lavagna, ceppo, porta finale */
.enamel{width:340px;background:#fbfaf6;border:8px solid #12181c;border-radius:14px;padding:20px 18px 18px;color:#12181c;text-align:center;box-shadow:0 20px 30px rgba(0,25,45,.35),inset 0 0 0 3px #fff,inset 0 0 0 5px #c9262f;pointer-events:none}

.chalk::before,.chalk::after{content:'';position:absolute;top:-82px;width:3px;height:70px;background:repeating-linear-gradient(#cfd8de 0 6px,#56646d 6px 9px)}.chalk::before{left:40px}.chalk::after{right:40px}

.chalk h4{margin:0 0 6px;font:700 34px/1 'Caveat',cursive;color:#ffd98a}

.thermo span{font:600 13px/1 'Barlow Condensed',sans-serif;letter-spacing:.2em;color:#7d8e98}

.evap .fan{width:84px;height:84px;border-radius:50%;background:repeating-radial-gradient(circle,#2c363d 0 2px,#8c9aa3 2px 7px);position:relative;border:4px solid #56646d}
.evap .fan::after{content:'';position:absolute;inset:8px;border-radius:50%;background:conic-gradient(#37434b 0 40deg,transparent 40deg 120deg,#37434b 120deg 160deg,transparent 160deg 240deg,#37434b 240deg 280deg,transparent 280deg);animation:spin 1.4s linear infinite;opacity:.85}

/* overlay: nebbia, vignetta, comandi */
.haze{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 34% 30% at 50% 44%,rgba(214,234,247,.55),rgba(214,234,247,0) 70%),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(2,10,18,.55) 100%)}

.mist::before,.mist::after{content:'';position:absolute;bottom:-20%;width:80%;height:80%;background:radial-gradient(closest-side,rgba(225,243,255,.30),transparent);filter:blur(24px);animation:drift 16s ease-in-out infinite alternate}
.mist::before{left:-20%}.mist::after{right:-25%;animation-delay:-8s;animation-duration:20s}
@keyframes drift{from{transform:translateX(-6%) scale(1)}to{transform:translateX(14%) scale(1.15)}}
.frost{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 160px 30px rgba(150,205,240,.30)}
.ctrl{position:absolute;right:16px;bottom:16px;z-index:12;display:flex;flex-direction:column;gap:8px}

.ctrl button:hover{background:#c9262f;border-color:#c9262f}.ctrl button[disabled]{opacity:.3;pointer-events:none}
.meter{position:absolute;right:24px;top:70px;bottom:150px;z-index:12;width:6px;border-radius:3px;background:rgba(255,255,255,.25)}

.skip,.reclose{position:absolute;top:12px;z-index:12;background:rgba(8,18,24,.8);color:#fff;border:0;border-radius:999px;padding:10px 16px;font:600 14px/1 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;backdrop-filter:blur(6px);cursor:pointer}
.skip{right:16px}.reclose{left:16px}
.skip:hover,.reclose:hover{background:#c9262f}

/* ---------- utilità ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
function fmtQty(p, q) {
  if (p.unit === 'pz') return q + (q === 1 ? ' pezzo' : ' pezzi');
  if (q < 1000) return q + ' g';
  return (q / 1000).toString().replace('.', ',') + ' kg';
}
const stepOf = p => p.unit === 'pz' ? 1 : 100;
const minOf = p => p.unit === 'pz' ? 1 : 100;

/* ---------- lista d’ordine (nessun e-commerce: solo una lista da inviare) ---------- */
const Cart = {
  key: 'mimmo-lista-' + (window.__VER || 'x'),
  items: [],
  subs: [],
  load() { try { const j = JSON.parse(localStorage.getItem(this.key) || '[]'); if (Array.isArray(j)) this.items = j.filter(i => byId(i.id)); } catch (e) { } },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.items)); } catch (e) { } },
  emit() { this.save(); this.subs.forEach(f => f()); },
  on(f) { this.subs.push(f); },
  get(id) { return this.items.find(i => i.id === id); },
  add(id, qty, note) {
    const p = byId(id); let it = this.get(id);
    if (it) { it.qty += (qty || p.def); } else { this.items.push({ id, qty: qty || p.def, note: note || '' }); }
    this.emit();
  },
  set(id, qty) { const p = byId(id), it = this.get(id); if (!it) return; it.qty = Math.max(minOf(p), qty); this.emit(); },
  note(id, n) { const it = this.get(id); if (it) { it.note = n; this.save(); } },
  remove(id) { this.items = this.items.filter(i => i.id !== id); this.emit(); },
  clear() { this.items = []; this.emit(); },
  count() { return this.items.length; }
};
Cart.load();

function buildMessage(f) {
  const lines = [];
  lines.push('Ciao Mimmo, sono ' + (f.name || '…') + '.');
  lines.push('Vorrei ordinare' + (f.when ? ' per ' + f.when : '') + ':');
  lines.push('');
  Cart.items.forEach(it => { const p = byId(it.id); lines.push('• ' + p.name + ' — ' + (p.unit === 'g' ? 'circa ' : '') + fmtQty(p, it.qty) + (it.note ? ' (' + it.note + ')' : '')); });
  if (f.notes) { lines.push(''); lines.push('Note: ' + f.notes); }
  if (f.phone) { lines.push(''); lines.push('Il mio numero: ' + f.phone); }
  lines.push(''); lines.push('Grazie!');
  return lines.join('\n');
}

function bindListPage(root) {
  const form = $('#orderform', root); if (!form) return;
  const upd = () => {
    const f = Object.fromEntries(new FormData(form).entries()); const t = buildMessage(f);
    $('#preview', root).textContent = t; $('#sendWa', root).href = waLink(t); $('#sendMail', root).href = mailLink(t, f.name);
  };
  form.addEventListener('input', upd); upd();
  const need = e => { const f = Object.fromEntries(new FormData(form).entries()); if (!f.name.trim()) { e.preventDefault(); const i = form.elements.name; i.focus(); i.classList.add('bad'); toast('Scrivi il tuo nome'); setTimeout(() => i.classList.remove('bad'), 1200); return false; } return true; };
  $('#sendWa', root).addEventListener('click', need); $('#sendMail', root).addEventListener('click', need);
  $('#copyMsg', root).addEventListener('click', () => { const t = $('#preview', root).textContent; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Testo copiato'), () => { const r = document.createRange(); r.selectNodeContents($('#preview', root)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selezionato: copialo con Ctrl/Cmd+C'); }); });
  const sec = $('.list-page', root) || root;
  sec.addEventListener('click', e => {
    const b = e.target.closest('[data-inc],[data-dec],[data-del]'); if (!b) return;
    const id = b.dataset.inc || b.dataset.dec || b.dataset.del, p = byId(id), it = Cart.get(id); if (!it) return;
    if (b.dataset.inc) Cart.set(id, it.qty + stepOf(p)); else if (b.dataset.dec) Cart.set(id, it.qty - stepOf(p)); else Cart.remove(id);
  });
  sec.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.note) Cart.note(e.target.dataset.note, e.target.value); });
}

function bindProduct(root, done) {
  const box = $('.pd', root); if (!box) return; const p = byId(box.dataset.id); const out = $('#pdq', box); let q = +out.dataset.q;
  const show = () => { out.textContent = fmtQty(p, q); };
  $('[data-pinc]', box).onclick = () => { q += stepOf(p); show(); };
  $('[data-pdec]', box).onclick = () => { q = Math.max(minOf(p), q - stepOf(p)); show(); };
  $('#pdadd', box).onclick = () => {
    const ex = Cart.get(p.id); if (ex) { ex.qty = q; ex.note = $('#pdn', box).value; Cart.emit(); } else { Cart.add(p.id, q, $('#pdn', box).value); }
    toast(p.name + ' è nella tua lista'); if (done) done();
  };
}

function cube(x, y, s) { return `<path class="m" d="M${x} ${y} v${s} l${s} ${s / 2} v${-s}z"/><path class="m" d="M${x + 2 * s} ${y} v${s} l${-s} ${s / 2} v${-s}z"/><path class="m2" d="M${x} ${y} l${s} ${-s / 2} l${s} ${s / 2} l${-s} ${s / 2}z"/>`; }
function skewer(x1, y1, x2, y2) {
  const ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI; let s = `<path class="s" d="M${x1} ${y1} L${x2} ${y2}"/>`;
  [['m', .2], ['v', .36], ['m', .52], ['g', .68], ['m', .84]].forEach(([c, t]) => { const x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t; s += `<rect class="${c}" x="${(x - 3.1).toFixed(2)}" y="${(y - 3.1).toFixed(2)}" width="6.2" height="6.2" rx="1.6" transform="rotate(${ang.toFixed(1)} ${x.toFixed(2)} ${y.toFixed(2)})"/>`; });
  return s;
}

function mountScene() {

  const img = $('.pd-img', el);
  img.insertAdjacentHTML('afterbegin', `<div class="lamp a"></div><div class="lamp b"></div>` + (TRAYTYPES.test(p.type) ? '' : `<div class="bar"></div><div class="hooks">${HOOKS}</div>`));

function closeSheet(silent) {

const R = {

  banco(arg) { return pageBanco(arg); },

function route() {

  app.innerHTML = R[name](arg);
  document.title = ({ home: '', banco: 'Il banco · ', ordine: 'La mia lista · ', mimmo: 'Chi è Mimmo · ', dove: 'Dove siamo · ', p: (byId(arg) ? byId(arg).name + ' · ' : '') }[name] || '') + 'Il Macellaio da Mimmo';

function updCart() { const n = Cart.count(); const a = $('#cartN'); if (a) a.textContent = n; $$('.cartN2').forEach(x => x.textContent = n); $$('[data-quick]').forEach(b => { b.textContent = Cart.get(b.dataset.quick) ? 'Nella lista ✓' : 'Aggiungi'; }); }

let lastW = innerWidth; addEventListener('resize', () => { if ((innerWidth < 700) !== (lastW < 700) && scene) { lastW = innerWidth; const wasOpen = opened; route(); opened = wasOpen; } lastW = innerWidth; });
